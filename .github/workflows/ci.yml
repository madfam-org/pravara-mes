name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.14'
  NODE_VERSION: '22'

jobs:
  networkpolicy-port-lint:
    name: NetworkPolicy port consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    # Prevents the 2026-05-04 status.enclii.dev outage class:
    # NetworkPolicy `ports:` clauses that don't intersect the selected pods'
    # containerPorts (silent CNI drop, hours to diagnose).
    # See scripts/check-networkpolicy-ports.py for full rationale.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run NetworkPolicy port lint
        run: python3 scripts/check-networkpolicy-ports.py infra/k8s/

  go-checks:
    name: Lint & Test (Go)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: pravara
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pravara_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/pravara-api/go.sum
            apps/telemetry-worker/go.sum
            packages/sdk-go/go.sum

      - name: Vet
        run: |
          # go.work uses per-module `use (...)` layout, so `./...` from repo
          # root doesn't resolve. Iterate each workspace module explicitly.
          set -e
          for mod in apps/pravara-api apps/machine-adapter apps/telemetry-worker apps/visualization-engine packages/sdk-go packages/sparkplug; do
            echo "=== go vet $mod ==="
            (cd "$mod" && go vet ./...)
          done

      - name: Test
        run: |
          set -e
          for mod in apps/pravara-api apps/machine-adapter apps/telemetry-worker apps/visualization-engine packages/sdk-go packages/sparkplug; do
            echo "=== go test $mod ==="
            (cd "$mod" && go test ./... -race -short)
          done
        env:
          DATABASE_URL: postgres://pravara:test@localhost:5432/pravara_test?sslmode=disable
          REDIS_URL: redis://localhost:6379

  go-postgres-tests:
    name: PostgreSQL Tests (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Every Go test gated on a database: the PRAVARA_TEST_DATABASE_URL suites
    # of pravara-api (each creates a scratch database, applies every
    # migration and serves requests as the NOSUPERUSER NOBYPASSRLS role
    # pravara_app) and telemetry-worker, and the tenant-isolation suites on
    # PRAVARA_ISOLATION_DB_URL (a database migrated with infra/db/migrate.sh,
    # connected as pravara_app). scripts/ci-postgres-tests.sh discovers the
    # set from the skip messages instead of keeping a list, and fails if none
    # ran, any test or subtest skipped, or fewer passed than were found.
    services:
      postgres:
        image: postgres:16-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: pravara
          # A throwaway value for a database that lives only for this job.
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: pravara_test
          # The tests connect as the password-less role pravara_app.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PRAVARA_TEST_DATABASE_URL: postgres://pravara@localhost:5432/pravara_test?sslmode=disable
      PRAVARA_ISOLATION_DB_URL: postgres://pravara_app@localhost:5432/pravara_isolation?sslmode=disable
      PRAVARA_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            apps/pravara-api/go.sum
            apps/telemetry-worker/go.sum
            packages/sdk-go/go.sum

      - name: Prepare the isolation database
        run: |
          set -euo pipefail
          admin='postgres://pravara@localhost:5432/pravara_test?sslmode=disable'
          iso='postgres://pravara@localhost:5432/pravara_isolation?sslmode=disable'
          psql "$admin" -v ON_ERROR_STOP=1 -c "CREATE ROLE pravara_app LOGIN NOSUPERUSER NOBYPASSRLS"
          psql "$admin" -v ON_ERROR_STOP=1 -c "CREATE DATABASE pravara_isolation"
          DATABASE_URL="$iso" infra/db/migrate.sh up
          psql "$iso" -v ON_ERROR_STOP=1 -f infra/db/roles/pravara_app_grants.sql

      - name: Run the database-gated tests
        run: scripts/ci-postgres-tests.sh

  ui-checks:
    name: Lint & Typecheck (UI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/pravara-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/pravara-ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run
        continue-on-error: true
