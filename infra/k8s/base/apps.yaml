# =============================================================================
# PravaraMES Application Deployments & Services
# All application workloads (excluding infrastructure: postgres, redis, emqx, centrifugo)
# =============================================================================

# -----------------------------------------------------------------------------
# pravara-api — Control plane API (Go/Gin)
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pravara-api
  namespace: pravara-mes
  labels:
    app: pravara-api
    app.kubernetes.io/name: pravara-api
    app.kubernetes.io/part-of: pravara-mes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pravara-api
      app.kubernetes.io/name: pravara-api
  template:
    metadata:
      labels:
        app: pravara-api
        app.kubernetes.io/name: pravara-api
        app.kubernetes.io/part-of: pravara-mes
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pravara-api
          image: pravara-api
          ports:
            - containerPort: 4500
              name: http
            # In-cluster only: EMQX HTTP auth/ACL (/v1/mqtt/auth, /v1/mqtt/acl).
            # Served by the pravara-api-internal Service; no ingress routes it.
            - containerPort: 4510
              name: internal
          # The Go binary is built with CGO_ENABLED=0 (musl/distroless),
          # so `os/user.Current()` (called transitively by lib/pq when no
          # explicit user= is in the DSN) fails with:
          # "user: Current requires cgo or $USER set in environment".
          # The pod runs as runAsUser: 10001 with no /etc/passwd entry,
          # so the libc fallback wouldn't help even if cgo were on.
          # Setting $USER explicitly is the canonical Go fix per the
          # error message and survives base-image swaps. CrashLoop
          # observed 252 restarts in 21h prior to this fix.
          env:
            - name: USER
              value: "pravara"
            # Accept the first-party session token of a sign-in in the app
            # (Janua's own audience). A person's token on any audience needs a
            # "pravara-mes:<role>" application role.
            # See docs/operations/sign-in-tokens.md.
            - name: OIDC_SESSION_AUDIENCES
              value: "janua.dev"
            - name: OIDC_SESSION_ROLE_APP
              value: "pravara-mes"
            # RFC 0051 native MCP (POST /mcp), off = 404, owner's switch (M6).
            # ON since the owner's ruling of 2026-11-23 (internal-devops
            # decisions/2026-11-23-ops-agents-mcp-access-wave-2.md): the ops
            # agents read it with their org-bound pravara-cogs:read client.
            - name: PRAVARA_MCP_ENABLED
              value: "true"
          envFrom:
            - configMapRef:
                name: pravara-config
            - secretRef:
                name: pravara-secrets
            # Janua machine clients for fabrication dispatch. Optional so the
            # API starts before the ExternalSecret syncs; dispatch then answers
            # 503 naming the missing client.
            - secretRef:
                name: pravara-service-clients
                optional: true
            # The bucket where dispatch keeps the manufacturing bytes it sent
            # (RFC 0059 S12). Written by `enclii buckets create
            # pravara-dispatch-artifacts` (STORAGE_BACKEND, R2_ENDPOINT_URL,
            # R2_BUCKET_NAME, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY). Optional
            # so pods start before the bucket exists; with DISPATCH_ENABLED
            # the API refuses to start without it. Last, so its keys win.
            # See docs/operations/fabrication-dispatch.md.
            - secretRef:
                name: pravara-dispatch-artifacts
                optional: true
          # ephemeral-storage covers the /tmp emptyDir below (kubelet counts
          # it against the pod) plus container logs; the root filesystem is
          # read-only. Limit = 1Gi /tmp + 256Mi for logs and margin.
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1280Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness and startup ask only whether the process is up.
          # Readiness also asks whether the database has every migration
          # this image was built with (docs/operations/schema-guard.md): an
          # image that arrives before its migration stays alive and not
          # ready, the previous pod keeps serving, and the rollout finishes
          # by itself once the migration is applied.
          startupProbe:
            httpGet:
              path: /health/live
              port: 4500
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4500
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4500
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # /tmp holds the kept-bytes spool files (fabrication dispatch):
        #   reads:   DISPATCH_ARTIFACT_CONCURRENT_READS (2)
        #            x DISPATCH_ARTIFACT_MAX_BYTES (256 MiB) = 512 MiB
        #   keeping: the runner keeps one object at a time,
        #            1 x 256 MiB                               = 256 MiB
        #   total                                              = 768 MiB
        # sizeLimit 1Gi leaves 256 MiB for anything else in /tmp. Raise it
        # with either setting.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pravara-api
  namespace: pravara-mes
  labels:
    app: pravara-api
    app.kubernetes.io/name: pravara-api
    app.kubernetes.io/part-of: pravara-mes
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4500
      name: http
  selector:
    app: pravara-api
    app.kubernetes.io/name: pravara-api
---
# In-cluster listener of pravara-api for the broker's HTTP authentication and
# authorization calls. Not referenced by any Ingress or tunnel route.
apiVersion: v1
kind: Service
metadata:
  name: pravara-api-internal
  namespace: pravara-mes
  labels:
    app: pravara-api
    app.kubernetes.io/name: pravara-api
    app.kubernetes.io/part-of: pravara-mes
spec:
  type: ClusterIP
  ports:
    - port: 4510
      targetPort: 4510
      name: internal
  selector:
    app: pravara-api
    app.kubernetes.io/name: pravara-api

