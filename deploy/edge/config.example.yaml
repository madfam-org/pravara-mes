# Pravara edge node configuration (site box). Copy to /etc/pravara-edge/config.yaml.
# This file holds no secrets: passwords and printer codes are read from the
# files named by *_file, readable only by the service user.
environment: production
loglevel: info

server:
  # Local status endpoints (/health, /metrics, /api/v1/devices).
  # Use 0.0.0.0 inside the container image; the compose file publishes it on
  # the host's loopback only.
  host: 0.0.0.0
  port: 4503

edge:
  enabled: true
  group_id: example-tenant          # pravara tenant slug (Sparkplug group_id)
  edge_node_id: site-example        # site-<slug>, unique per site box
  primary_host_id: pravara-mes      # wait for spBv1.0/STATE/pravara-mes before births

  # The broker through the local cloudflared listener (compose service name,
  # or 127.0.0.1 with the systemd units). TLS is end-to-end to the broker.
  broker_url: ssl://cloudflared:8883
  tls_server_name: mqtt.example.test   # name on the broker certificate
  tls_ca_file: /etc/pravara-edge/broker-ca.pem
  # MQTT credential: generated by the box itself with `-enroll` and approved
  # by a tenant admin in pravara (see README). username defaults to
  # edge:<group_id>:<edge_node_id>.
  password_file: /var/lib/pravara-edge/mqtt_password
  enrollment_url: https://api.example.test   # pravara API base URL (https)

  state_dir: /var/lib/pravara-edge     # bdSeq and artifact scratch space
  poll_interval: 2s
  offline_after: 3                     # failed polls before DDEATH
  artifact_max_bytes: 536870912
  artifact_timeout: 10m
  job_start_timeout: 2m

  # simulate: true replaces every printer with a local simulator (dry run).
  simulate: false

  devices:
    # Klipper printer via Moonraker. device_id = the machine code registered in pravara.
    - device_id: VORON-01
      definition: voron_2_4
      host: 192.0.2.10                 # printer address on the site LAN
      port: 7125
      secret_file: /etc/pravara-edge/secrets/voron-01.moonraker_key   # omit if Moonraker needs no key
      material_slots: 1
      capabilities:
        nozzle_diameters_mm: [0.4]
        enclosure: true

    # Bambu Lab printer in LAN-only mode with Developer Mode enabled.
    - device_id: A1-01
      definition: bambu_a1
      host: 192.0.2.11
      serial: PRINTER-SERIAL-HERE
      secret_file: /etc/pravara-edge/secrets/a1-01.access_code
      # Optional: pin the printer's self-signed certificate (sha256 of the DER, hex).
      # tls_pin_sha256: ""
