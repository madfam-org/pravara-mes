# Site box: cloudflared (Cloudflare Access TCP to the broker) + the edge node.
# Usage: see README.md. No secret values live in this file.
name: pravara-edge

services:
  cloudflared:
    # Pin a cloudflared release tag or digest in .env (CLOUDFLARED_IMAGE).
    image: ${CLOUDFLARED_IMAGE:?pin cloudflare/cloudflared to a release tag or digest in .env}
    restart: unless-stopped
    # Local TCP listener that forwards to the broker through Cloudflare Access.
    # MQTT stays end-to-end TLS: the edge node verifies the broker certificate.
    command: ["access", "tcp", "--hostname", "${BROKER_HOSTNAME:?set BROKER_HOSTNAME in .env}", "--url", "0.0.0.0:8883"]
    env_file:
      # TUNNEL_SERVICE_TOKEN_ID / TUNNEL_SERVICE_TOKEN_SECRET (Access service token)
      - /etc/pravara-edge/cloudflared.env
    networks: [edge]

  edge:
    image: ${EDGE_IMAGE:-pravara-edge:local}
    build:
      context: ../..
      dockerfile: deploy/edge/Dockerfile
    restart: unless-stopped
    depends_on: [cloudflared]
    volumes:
      - /etc/pravara-edge/config.yaml:/etc/pravara-edge/config.yaml:ro
      - /etc/pravara-edge/broker-ca.pem:/etc/pravara-edge/broker-ca.pem:ro
      - /etc/pravara-edge/secrets:/etc/pravara-edge/secrets:ro
      - edge-state:/var/lib/pravara-edge
    # Health and status stay on the box (loopback of the host only).
    ports:
      - "127.0.0.1:4503:4503"
    networks: [edge]

networks:
  edge: {}

volumes:
  edge-state: {}
